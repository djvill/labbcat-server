<h1 id="title" i18n="page header">Change password</h1>
<div id="password-form">
  <div class="list">
    <div class="item password" i18n-title title="Enter your current password">
      <label for="currentPassword" i18n>Current password</label>
      <span class="value">
        <input type="password"
               id="currentPassword"
               [(ngModel)]="currentPassword"
               (change)="checkForm()"
               (keyup.enter)="changePassword();"
               required
               i18n-placeholder placeholder="Current password"
               appAutofocus="true">
      </span>
    </div>
    <div class="item password" i18n-title title="Enter a new password">
      <label for="newPassword" i18n>New password</label>
      <span class="value">
        <input type="password"
               id="newPassword"
               [(ngModel)]="newPassword"
               (change)="checkForm()"
               (keyup.enter)="changePassword();"
               required
               i18n-placeholder placeholder="New password">
      </span>
    </div>
    <div class="item password" i18n-title title="Enter the same password again">
      <label for="repeatPassword" i18n>Repeat password</label>
      <span class="value">
        <input type="password"
               id="repeatPassword"
               [(ngModel)]="repeatPassword"
               (change)="checkForm()"
               (keyup.enter)="changePassword();"
               required
               i18n-placeholder placeholder="Repeat password">
      </span>
    </div>
  </div>
  <div class="buttons">
    <lib-button action="save"
                (press)="changePassword();"
                [processing]="processing"
                [disabled]="!changed"
                i18n-title title="Change password"></lib-button>
  </div>
</div>
<div id="links">
  <ul>
    <li *ngIf="error" class="item link">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdW9U912VhiZN2sjFk6jQFulhY82YNdqkQQRKVJT2LvAFvqnw/viewform?usp=sf_link" target="_blank">
        <img src="./user-interface/en/assets/fa-unlock.svg">
        <span class="dash-label" i18n>Forgot password?</span>
      </a>
    </li>
  </ul>
</div>
